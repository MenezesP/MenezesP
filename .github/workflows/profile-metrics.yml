name: Generate profile metrics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-metrics.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: MenezesP
          BRANCH_NAME: main
          UTC_OFFSET: -3
          THEME: github_dark
          NAME: Paulo de Menezes
